name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      UpdateFeedUrl: https://github.com/salahadoroobi/qusasa-releases/releases/latest/download/stable.json
      OcrRelayUrl: https://qusasa-ocr-relay.chirpydate4.chatgpt.site/v1/scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET Framework 4.8
        run: |
          choco install netfx-4.8-devpack -y

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Application
        run: |
          dotnet build Qusasa.csproj -c Release --nologo

      - name: Build Installer
        run: |
          $iss = "Qusasa.iss"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /Q $iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qusasa-Installer
          path: bin/Installer/Qusasa-*-Engine.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Installer/Qusasa-*-Engine.exe
          generate_release_notes: true
